name: Hero Town Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Prepare Godot cache folder
        run: mkdir -p .godot

      - name: Reuse debug signing key
        uses: actions/cache@v6
        with:
          path: .godot/debug.keystore
          key: hero-town-debug-keystore-v1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Download Godot and export templates
        run: |
          GODOT_TAG="${GODOT_VERSION}-stable"
          GODOT_BIN="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BIN}.zip" \
            --output /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_BIN}"
          echo "/tmp/godot" >> "$GITHUB_PATH"
          echo "GODOT_BIN=/tmp/godot/${GODOT_BIN}" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"

      - name: Configure Android signing and SDK paths
        run: |
          mkdir -p .godot "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f .godot/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore .godot/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000 \
              -keyalg RSA
          fi
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate project
        run: "$GODOT_BIN --headless --editor --path . --quit"

      - name: Run city generation smoke test
        run: "$GODOT_BIN --headless --path . --script res://tests/city_smoke_test.gd"

      - name: Export debug APK
        run: |
          mkdir -p build/android
          set +e
          "$GODOT_BIN" --headless --verbose --path . --export-debug "Android" build/android/hero_town_debug.apk > /tmp/godot-export.log 2>&1
          export_status=$?
          cat /tmp/godot-export.log
          if [ "$export_status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=Godot Android export::$line"
            done < <(tail -n 40 /tmp/godot-export.log)
            exit "$export_status"
          fi
          test -s build/android/hero_town_debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-town-android-debug-apk
          path: build/android/hero_town_debug.apk
          retention-days: 14
